<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e9f5fc">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Explore available Park Forum dates and find a conversation worth having.">
  <title>Park Forum — Dates &amp; Ideas</title>
  <link rel="canonical" href="https://bitcoinpark.com/catalog/">
  <link rel="icon" href="/forum/assets/bitcoin-park-mark.png">
  <link rel="preload" href="/forum/assets/libre-caslon-display.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="/forum/assets/dm-sans.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="/forum/world.css?v=arch-5">
  <link rel="stylesheet" href="/forum/engraved.css?v=3">
  <link rel="stylesheet" href="/forum/catalog-steps.css?v=1">
  <script type="module" src="/forum/catalog-steps.js?v=1"></script>
</head>
<body data-page="sponsor-catalog">
  <a class="skip-link" href="#main">Skip to catalog</a>
  <svg class="filter-defs" aria-hidden="true" width="0" height="0"><defs><filter id="brand-color" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="0 0 0 0 .075 0 0 0 0 .22 0 0 0 0 .36 .5 .5 .5 0 -.5"/></filter></defs></svg>
  <div class="world-shell catalog-shell">
    <div class="world catalog-world" aria-hidden="true"><img class="catalog-arch" src="/forum/assets/roman-arch-front.webp" alt="" width="1536" height="1024" fetchpriority="high"><div class="catalog-light"></div></div>
    <header class="world-header">
      <a class="world-brand" href="/forum/" aria-label="Park Forum home"><img src="/forum/assets/bitcoin-park.webp" alt="" width="50" height="50"><span>Park Forum</span></a>
      <button class="world-back" id="catalog-lock" type="button">Leave catalog ↗</button>
    </header>
    <main id="main" class="catalog-stage">
      <section class="scene-panel catalog-window" id="ideas-explorer" aria-labelledby="catalog-title">
        <header class="catalog-heading">
          <p class="scene-eyebrow" id="catalog-progress">Step 1 of 2</p>
          <h1 id="catalog-title" tabindex="-1">Choose a date</h1>
        </header>
        <section class="catalog-step date-step" id="date-step" aria-labelledby="catalog-title">
          <p class="step-description" id="date-count">Available Forum dates</p>
          <div class="date-options" id="date-options" role="group" aria-label="Available Forum dates"></div>
        </section>
        <section class="catalog-step idea-step" id="idea-step" aria-labelledby="catalog-title" hidden>
          <div class="chosen-date"><p id="chosen-date"></p><button class="scene-button" id="change-date" type="button">← Change date</button></div>
          <div class="ideas-scroll" id="idea-results" aria-label="Conversation ideas by theme"></div>
          <section class="catalog-selection" id="forum-selection" aria-labelledby="selection-title" hidden>
            <div class="selection-copy"><p class="selection-label">Your conversation</p><h2 id="selection-title" tabindex="-1"></h2></div>
            <div class="selection-actions"><button class="scene-button" id="selection-copy" type="button">Copy selection ↗</button><button class="scene-button" id="selection-clear" type="button">Clear idea ×</button></div>
            <p id="selection-status" class="selection-status" role="status" aria-live="polite"></p>
          </section>
        </section>
        <p class="catalog-note"><strong>Up to two sponsors per Forum.</strong> Selections are for discussion; dates remain open.</p>
      </section>
    </main>
  </div>
  <!-- FORUM_CATALOG_DATA -->
</body>
</html>
